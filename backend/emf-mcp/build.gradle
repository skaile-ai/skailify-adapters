plugins {
  id 'java'
}

repositories {
  mavenCentral()
}

subprojects {
    apply plugin: 'java'
    repositories {
        mavenCentral()
    }
    test {
        useJUnitPlatform()
    }
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.14.2'
        testImplementation 'org.junit.platform:junit-platform-launcher:1.14.4'
        testImplementation 'org.assertj:assertj-core:3.27.7'
    }

    // The bnd 'generate' step can remove generated/buildfiles, the marker the workspace
    // repository uses to see a project's bundles (taken over from eclipse-fennec/emf.odata).
    tasks.matching { it.name == 'jar' }.configureEach {
        outputs.upToDateWhen { project.file('generated/buildfiles').exists() }
    }
}
