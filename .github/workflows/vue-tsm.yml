name: vue-tsm

on:
  push:
    branches: [main]
    paths:
      - 'frontend/vue-tsm/**'
      - '.github/workflows/vue-tsm.yml'
  pull_request:
    paths:
      - 'frontend/vue-tsm/**'
      - '.github/workflows/vue-tsm.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/vue-tsm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/vue-tsm/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run type-check
